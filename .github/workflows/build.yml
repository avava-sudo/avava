name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
          pip install --upgrade pip setuptools
          pip install buildozer cython

      - name: Accept Android SDK Licenses
        run: |
          # Предварительно подготавливаем директорию Android SDK и принимаем все лицензии
          mkdir -p ~/.buildozer/android/platform
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
